name: CI

on:
  push:
  pull_request:

# Never calls the live Claude API: unit and integration tests use fakes,
# so CI is free, deterministic and needs no secrets.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      # Ordered fast to slow so the cheapest failure is reported first.
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      # Coverage is measured across both test layers and checked once, at the end.
      # server.py is only exercised by integration tests, so a 90% check on unit tests
      # alone would fail wrongly. The unit step disables the threshold; the integration
      # step appends to the same data and applies fail_under = 90 from pyproject.toml.
      - name: Unit tests
        run: pytest tests/unit --cov --cov-fail-under=0
      - name: Integration tests
        run: pytest tests/integration --cov --cov-append --cov-report=term-missing
      - name: Dependency audit
        run: pip-audit --skip-editable
