[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "it-requests"
version = "0.1.0"
description = "IT equipment request handler: MCP server plus ReAct agent (Week 7 lab)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp==2.3.0",
    # Imported directly by it_requests.data for the data models. Declared explicitly so we
    # don't rely on it arriving only as a dependency of mcp.
    "pydantic>=2.14,<3",
    # Writes trace spans to traces/<request_id>.jsonl (PLAN §6). Pinned to exactly the
    # installed opentelemetry-api version (which mcp pulls in): the SDK and the API are
    # released together, and a mismatched pair can fail at import or drop spans.
    "opentelemetry-sdk==1.45.2",
    # Claude API client for the agent (agent/llm.py). Pinned exactly: the response types
    # (Message, Usage) are read field by field for the cost ledger, and the test fakes build
    # the SDK's own types, so an unannounced field change must not slip in with an upgrade.
    "anthropic==2.13.0",
    # Loads ANTHROPIC_API_KEY and BUDGET_USD from .env in scripts/agent_once.py, so the key
    # lives in one gitignored file and never in code or shell history.
    "python-dotenv==1.2.4",
]

[project.scripts]
# Installed command that starts the MCP server (same as `make serve`).
it-requests-server = "it_requests.server:main"

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/it_requests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -m "not slow" here too, so a plain `pytest` never spends money. A later -m on the command
# line replaces it: `make test-live` passes -m slow.
addopts = "-ra --strict-markers -m 'not slow'"
# Registered so a typo in a marker fails loudly (--strict-markers).
markers = [
    "slow: real network, real model or other slow resource (deselected by default)",
    "eval: calls the paid Claude API; skipped when ANTHROPIC_API_KEY is not set",
]

[tool.coverage.run]
source = ["it_requests"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]
# SIM300 flags `MODULE.CONSTANT == value` as a "Yoda condition" because the name is
# upper-case; that ordering (actual == expected) is the readable one in tests.
ignore = ["SIM300"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
