[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "it-requests"
version = "0.1.0"
description = "IT equipment request handler: MCP server plus ReAct agent (Week 7 lab)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/it_requests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["it_requests"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]
# SIM300 flags `MODULE.CONSTANT == value` as a "Yoda condition" because the name is
# upper-case; that ordering (actual == expected) is the readable one in tests.
ignore = ["SIM300"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
